[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "file-transfer-reqif-tool"
version = "1.0.0"
description = "Desktop tool for exporting and importing Jama Connect project administration configuration."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ftr-tool = "ftr_tool.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

